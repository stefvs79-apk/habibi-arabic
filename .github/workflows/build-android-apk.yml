# =============================================================================
# Habibi (حَبِيبِي) — Automated Android APK CI/CD Pipeline (v2.0)
# Includes:
#   - Pre-seeded 320-word Habibi SQLite Database (@capacitor-community/sqlite)
#   - Native Android Arabic Text-to-Speech (@capacitor-community/text-to-speech)
#   - Official Google ML Kit On-Device Translation (@capacitor-mlkit/translation)
#   - Custom Habibi Adaptive App Icons & Splash Screen (@capacitor/assets)
# =============================================================================

name: Build Habibi Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile & Upload Habibi APK (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate & Verify Pre-Seeded Habibi SQLite Database (28 Letters + 320 Words)
        run: |
          mkdir -p www/assets/databases
          python3 - << 'PY'
          import sys
          sys.path.insert(0, 'database')
          import habibi_etl_and_fsrs_engine as etl
          p = etl.ArabicCurriculumPipeline('www/assets/databases/habibiSQLite.db', 'database/habibi_schema.sql')
          p.initialize_schema()
          p.seed_reference_curriculum()
          cur = p.conn.cursor()
          letters = cur.execute('SELECT COUNT(*) FROM arabic_letters').fetchone()[0]
          lemmas = cur.execute('SELECT COUNT(*) FROM lexical_entries').fetchone()[0]
          variants = cur.execute('SELECT COUNT(*) FROM dialect_variants').fetchone()[0]
          print(f'Verified habibiSQLite.db: {letters} letters, {lemmas} lexical entries, {variants} dialect rows')
          p.conn.close()
          PY
          ls -lh www/assets/databases/habibiSQLite.db

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize Capacitor Android, Icons/Splash & Native Plugins (ML Kit + TTS + SQLite)
        run: |
          npm install --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -d "assets" ]; then
            npx --yes @capacitor/assets@3.0.5 generate --android || echo "Continuing with default icon fallback"
          fi
          npx cap copy android
          npx cap sync android
          python3 -c "
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          perm = '<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />'
          if 'RECORD_AUDIO' not in t:
              t = t.replace('<application', perm + '\n    <application', 1)
              m.write_text(t)
          "

      - name: Build Debug APK (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Prepare Installable Habibi APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Habibi-Arabic-debug.apk

      - name: Upload Installable Habibi Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Habibi-Android-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/Habibi-Arabic-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
