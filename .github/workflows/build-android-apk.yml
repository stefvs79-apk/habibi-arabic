# =============================================================================
# Habibi (حَبِيبِي) — Automated Android APK CI/CD Pipeline
# File Location: .github/workflows/build-android-apk.yml
#
# References:
#   - Capacitor Android Docs: https://capacitorjs.com/docs/android
#   - GitHub Actions setup-java@v4: https://github.com/actions/setup-java
#   - Ionic / Capacitor GitHub Actions Guide: https://ionic.io/docs/tutorials/integrations/github-actions/build-android
#   - Capacitor Community SQLite: https://github.com/capacitor-community/sqlite
# =============================================================================

name: Build Habibi Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile & Upload Habibi APK (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 to build/verify the pre-seeded Habibi SQLite database
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Build & verify pre-seeded Habibi SQLite database (28 Letters + 200 Words)
      - name: Generate & Verify Pre-Seeded Habibi SQLite Database (28 Letters + 200 Words)
        run: |
          mkdir -p www/assets/databases
          python3 - << 'PY'
          import sys
          sys.path.insert(0, 'database')
          import habibi_etl_and_fsrs_engine as etl
          p = etl.ArabicCurriculumPipeline('www/assets/databases/habibiSQLite.db', 'database/habibi_schema.sql')
          p.initialize_schema()
          p.seed_reference_curriculum()
          cur = p.conn.cursor()
          letters = cur.execute('SELECT COUNT(*) FROM arabic_letters').fetchone()[0]
          lemmas = cur.execute('SELECT COUNT(*) FROM lexical_entries').fetchone()[0]
          print(f'Verified habibiSQLite.db: {letters} letters, {lemmas} lexical entries')
          p.conn.close()
          PY
          ls -lh www/assets/databases/habibiSQLite.db

      # 4. Set up Node.js 20 for Capacitor CLI & plugins
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # 5. Set up JDK 21 (Temurin)
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 6. Install Capacitor & SQLite dependencies and sync Android native project
      - name: Initialize & Sync Capacitor Android Platform
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      # 7. Compile installable Debug APK via Gradle
      - name: Build Debug APK (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      # 8. Rename APK to Habibi-Arabic-debug.apk for clean mobile download
      - name: Prepare Installable Habibi APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Habibi-Arabic-debug.apk

      # 9. Upload the installable Debug APK to the GitHub Actions run summary
      - name: Upload Installable Habibi Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Habibi-Android-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/Habibi-Arabic-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
